<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineZone - Alle Minecraft Blöcke & Items</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #eaeded; color: #0f1111; }
    
    header { background-color: #131921; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .logo { font-size: 24px; font-weight: bold; color: #ff9900; cursor: pointer; }
    .logo span { color: white; }
    .search-bar { flex-grow: 1; max-width: 500px; display: flex; }
    .search-bar input { width: 100%; padding: 8px 12px; border: none; border-radius: 4px 0 0 4px; font-size: 14px; outline: none; }
    .search-bar button { background-color: #febd69; border: none; padding: 8px 16px; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }
    
    nav { background-color: #232f3e; padding: 10px 20px; display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-btn { background: transparent; border: 1px solid #ff9900; color: white; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .nav-btn:hover, .nav-btn.active { background-color: #ff9900; color: #131921; }

    .hero-banner { background: #232f3e; color: white; padding: 16px; text-align: center; border-bottom: 3px solid #ff9900; margin-bottom: 20px; }
    .hero-banner h1 { font-size: 22px; margin-bottom: 4px; }
    .hero-banner p { font-size: 12px; color: #ddd; }

    .container { max-width: 1200px; margin: 0 auto 30px auto; padding: 0 20px; display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; }
    
    .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .product-card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #ddd; text-align: center; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    
    .deal-badge { position: absolute; top: 8px; left: 8px; background-color: #cc0c39; color: white; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
    .product-icon { font-size: 34px; margin: 6px 0; }
    .product-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    
    .price-box { margin-bottom: 8px; }
    .old-price { text-decoration: line-through; color: #777; font-size: 10px; margin-right: 4px; }
    .current-price { color: #b12704; font-size: 13px; font-weight: bold; }
    
    .qty-box { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 8px; font-size: 11px; }
    .qty-box input { width: 55px; padding: 3px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; text-align: center; }

    .btn-add { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 12px; }
    .btn-add:hover { background-color: #f7ca00; }
    
    .cart-box { background: white; padding: 18px; border-radius: 8px; border: 1px solid #ddd; height: fit-content; position: sticky; top: 20px; }
    .cart-box h2 { border-bottom: 1px solid #ccc; padding-bottom: 8px; margin-bottom: 12px; font-size: 16px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; background: #f7f7f7; padding: 6px 8px; border-radius: 4px; }
    
    form { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    form label { font-size: 11px; font-weight: bold; }
    form input { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .btn-order { background-color: #ffa41c; border: 1px solid #ff8f00; border-radius: 20px; padding: 10px; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 8px; }
    .btn-order:hover { background-color: #f08804; }
    .btn-order:disabled { background-color: #e7e7e7; border-color: #ddd; color: #888; cursor: not-allowed; }

    #no-results { display: none; background: white; padding: 20px; border-radius: 8px; text-align: center; color: #555; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo" onclick="filterCategory('all')">Mine<span>Zone</span></div>

        <input type="hidden" name="Bestellung" id="hidden-cart-input">
        
        <label for="gamertag">Dein Minecraft Name / Gamertag:</label>
        <input type="text" id="gamertag" name="Gamertag" placeholder="z.B. Steve123" required>

        <label for="coords">Deine Koordinaten / Server-Infos:</label>
        <input type="text" id="coords" name="Koordinaten" placeholder="z.B. X: 100, Y: 64, Z: -200" required>

        <label for="email">Deine E-Mail-Adresse:</label>
        <input type="email" id="email" name="Kunden-Email" placeholder="deine@email.de" required>
