<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineZone - Alle Minecraft Blöcke & Items</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #eaeded; color: #0f1111; }
    
    header { background-color: #131921; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .logo { font-size: 24px; font-weight: bold; color: #ff9900; cursor: pointer; }
    .logo span { color: white; }
    .search-bar { flex-grow: 1; max-width: 500px; display: flex; }
    .search-bar input { width: 100%; padding: 8px 12px; border: none; border-radius: 4px 0 0 4px; font-size: 14px; outline: none; }
    .search-bar button { background-color: #febd69; border: none; padding: 8px 16px; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }
    
    nav { background-color: #232f3e; padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn { background: transparent; border: 1px solid #ff9900; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .nav-btn:hover, .nav-btn.active { background-color: #ff9900; color: #131921; }

    .hero-banner { background: #232f3e; color: white; padding: 18px; text-align: center; border-bottom: 3px solid #ff9900; margin-bottom: 20px; }
    .hero-banner h1 { font-size: 22px; margin-bottom: 5px; }
    .hero-banner p { font-size: 13px; color: #ddd; }

    .container { max-width: 1200px; margin: 0 auto 30px auto; padding: 0 20px; display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; }
    
    .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .product-card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #ddd; text-align: center; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    
    .deal-badge { position: absolute; top: 8px; left: 8px; background-color: #cc0c39; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
    .product-icon { font-size: 38px; margin: 8px 0; }
    .product-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    
    .price-box { margin-bottom: 8px; }
    .old-price { text-decoration: line-through; color: #777; font-size: 11px; margin-right: 5px; }
    .current-price { color: #b12704; font-size: 14px; font-weight: bold; }
    
    .qty-box { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 8px; font-size: 12px; }
    .qty-box input { width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; text-align: center; }

    .btn-add { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 7px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; }
    .btn-add:hover { background-color: #f7ca00; }
    
    .cart-box { background: white; padding: 18px; border-radius: 8px; border: 1px solid #ddd; height: fit-content; position: sticky; top: 20px; }
    .cart-box h2 { border-bottom: 1px solid #ccc; padding-bottom: 8px; margin-bottom: 12px; font-size: 17px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; background: #f7f7f7; padding: 6px 8px; border-radius: 4px; }
    
    form { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    form label { font-size: 11px; font-weight: bold; }
    form input { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .btn-order { background-color: #ffa41c; border: 1px solid #ff8f00; border-radius: 20px; padding: 10px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 8px; }
    .btn-order:hover { background-color: #f08804; }
    .btn-order:disabled { background-color: #e7e7e7; border-color: #ddd; color: #888; cursor: not-allowed; }

    #no-results { display: none; background: white; padding: 20px; border-radius: 8px; text-align: center; color: #555; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo" onclick="filterCategory('all')">Mine<span>Zone</span></div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Block oder Item suchen...">
      <button onclick="performSearch()">Suchen</button>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <button class="nav-btn active" id="btn-all" onclick="filterCategory('all')">Alle Items</button>
    <button class="nav-btn" id="btn-deals" onclick="filterCategory('deals')">🔥 Angebote</button>
    <button class="nav-btn" id="btn-bau" onclick="filterCategory('bau')">🧱 Baustoffe</button>
    <button class="nav-btn" id="btn-tools" onclick="filterCategory('tools')">⚔️ Ausrüstung</button>
    <button class="nav-btn" id="btn-redstone" onclick="filterCategory('redstone')">⚡ Redstone</button>
    <button class="nav-btn" id="btn-food" onclick="filterCategory('food')">🍎 Nahrung & Tränke</button>
    <button class="nav-btn" id="btn-mob" onclick="filterCategory('mob')">🦴 Mob Drops</button>
  </nav>

  <!-- Banner -->
  <div class="hero-banner">
    <h1>Alle Minecraft Blöcke & Items ⛏️</h1>
    <p>Bezahle nur mit Eisen & Diamanten | Menge frei wählbar von 1 bis 64 Stück!</p>
  </div>

  <div class="container">
    <!-- Produktliste -->
    <div>
      <h2 class="section-title" id="grid-title">Alle Items</h2>
      <div id="no-results">Kein Item gefunden.</div>
      <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- Warenkorb -->
    <div class="cart-box">
      <h2>Einkaufswagen</h2>
      <div id="cart-items">
        <p style="color: #777; font-size: 13px;">Dein Einkaufswagen ist leer.</p>
      </div>
      
      <form action="https://formspree.io/f/mnpjdykk" method="POST">
        <input type="hidden" name="Bestellung" id="hidden-cart-input">
        
        <label for="gamertag">Dein Minecraft Name / Gamertag:</label>
        <input type="text" id="gamertag" name="Gamertag" placeholder="z.B. Steve123" required>

        <label for="coords">Deine Koordinaten / Server-Infos:</label>
        <input type="text" id="coords" name="Koordinaten" placeholder="z.B. X: 100, Y: 64, Z: -200" required>

        <label for="email">Deine E-Mail-Adresse:</label>
        <input type="email" id="email" name="Kunden-Email" placeholder="deine@email.de" required>

        <button type="submit" class="btn-order" id="submit-btn" disabled>Jetzt Bestellung abschicken</button>
      </form>
    </div>
  </div>

  <script>
    // Keine Erze enthalten. Preise sind auf Stückbasis berechnet (1 bis max 64 auswählbar).
    const products = [
      // BAUSTOFFE
      { id: 1, name: "Obsidian", priceNum: 2, curr: "Eisen", category: "bau", icon: "🔮", isDeal: true, oldPrice: "3x Eisen", dealText: "ANGEBOT" },
      { id: 2, name: "Eichenholz Stamm", priceNum: 1, curr: "Eisen", category: "bau", icon: "🪵", isDeal: false },
      { id: 3, name: "Bruchstein (Cobblestone)", priceNum: 1, curr: "Eisen", category: "bau", icon: "🪨", isDeal: false },
      { id: 4, name: "Ziegelstein Block", priceNum: 1, curr: "Eisen", category: "bau", icon: "🧱", isDeal: false },
      { id: 5, name: "Glas Block", priceNum: 1, curr: "Eisen", category: "bau", icon: "🪟", isDeal: false },
      { id: 6, name: "Netherrack", priceNum: 1, curr: "Eisen", category: "bau", icon: "🔥", isDeal: false },
      { id: 7, name: "Endstein", priceNum: 2, curr: "Eisen", category: "bau", icon: "🟡", isDeal: false },
      { id: 8, name: "Seelen-Sand", priceNum: 1, curr: "Eisen", category: "bau", icon: "🤎", isDeal: false },
      { id: 9, name: "Quarzblock", priceNum: 2, curr: "Eisen", category: "bau", icon: "🏛️", isDeal: false },

      // AUSRÜSTUNG & WERKZEUGE
      { id: 10, name: "Netherit Spitzhacke", priceNum: 14, curr: "Diamanten", category: "tools", icon: "⛏️", isDeal: true, oldPrice: "18x Diamanten", dealText: "TOP DEAL" },
      { id: 11, name: "Diamantschwert", priceNum: 4, curr: "Diamanten", category: "tools", icon: "⚔️", isDeal: false },
      { id: 12, name: "Diamant Brustpanzer", priceNum: 10, curr: "Diamanten", category: "tools", icon: "👕", isDeal: false },
      { id: 13, name: "Bogen & Pfeil Set", priceNum: 3, curr: "Eisen", category: "tools", icon: "🏹", isDeal: false },
      { id: 14, name: "Elytra", priceNum: 18, curr: "Diamanten", category: "tools", icon: "🪽", isDeal: true, oldPrice: "24x Diamanten", dealText: "SELTEN" },
      { id: 15, name: "Dreizack (Trident)", priceNum: 12, curr: "Diamanten", category: "tools", icon: "🔱", isDeal: false },

      // REDSTONE
      { id: 16, name: "Redstone Staub", priceNum: 1, curr: "Eisen", category: "redstone", icon: "🔴", isDeal: false },
      { id: 17, name: "Kolben (Piston)", priceNum: 2, curr: "Eisen", category: "redstone", icon: "📦", isDeal: false },
      { id: 18, name: "Klebriger Kolben", priceNum: 3, curr: "Eisen", category: "redstone", icon: "🟢", isDeal: false },
      { id: 19, name: "Trichter (Hopper)", priceNum: 4, curr: "Eisen", category: "redstone", icon: "🔻", isDeal: false },
      { id: 20, name: "Beobachter (Observer)", priceNum: 2, curr: "Eisen", category: "redstone", icon: "👁️", isDeal: false },

      // NAHRUNG & TRÄNKE
      { id: 21, name: "Goldener Apfel", priceNum: 3, curr: "Diamanten", category: "food", icon: "🍏", isDeal: false },
      { id: 22, name: "Gebratenes Rindfleisch", priceNum: 1, curr: "Eisen", category: "food", icon: "🥩", isDeal: false },
      { id: 23, name: "Zaubertrank der Heilung", priceNum: 2, curr: "Eisen", category: "food", icon: "🧪", isDeal: false },
      { id: 24, name: "Brot", priceNum: 1, curr: "Eisen", category: "food", icon: "🍞", isDeal: false },

      // MOB DROPS & SONSTIGES
      { id: 25, name: "Enderperle", priceNum: 2, curr: "Eisen", category: "mob", icon: "🔮", isDeal: false },
      { id: 26, name: "Lohenrute (Blaze Rod)", priceNum: 2, curr: "Eisen", category: "mob", icon: "🔥", isDeal: false },
      { id: 27, name: "Schleimball", priceNum: 1, curr: "Eisen", category: "mob", icon: "🟢", isDeal: false },
      { id: 28, name: "Totem der Unsterblichkeit", priceNum: 6, curr: "Diamanten", category: "mob", icon: "🗿", isDeal: true, oldPrice: "9x Diamanten", dealText: "RETTUNG" },
      { id: 29, name: "Sattel", priceNum: 3, curr: "Eisen", category: "mob", icon: "🏇", isDeal: false }
    ];

    let cart = [];

    function displayProducts(items) {
      const grid = document.getElementById('product-grid');
      const noResults = document.getElementById('no-results');
      grid.innerHTML = '';

      if (items.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';

        let badge = p.isDeal ? `<div class="deal-badge">${p.dealText}</div>` : '';
        let priceStr = `${p.priceNum}x ${p.curr} / Stk.`;
        let priceHTML = p.oldPrice 
          ? `<span class="old-price">${p.oldPrice}</span><span class="current-price">${priceStr}</span>` 
          : `<span class="current-price">${priceStr}</span>`;

        card.innerHTML = `
          ${badge}
          <div>
            <div class="product-icon">${p.icon}</div>
            <div class="product-title">${p.name}</div>
            <div class="price-box">${priceHTML}</div>
          </div>
          <div>
            <div class="qty-box">
              <label for="qty-${p.id}">Menge:</label>
              <input type="number" id="qty-${p.id}" value="1" min="1" max="64" onchange="validateQty(this)">
            </div>
            <button class="btn-add" onclick="addToCart(${p.id})">In den Einkaufswagen</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function validateQty(input) {
      let val = parseInt(input.value, 10);
      if (isNaN(val) || val < 1) input.value = 1;
      if (val > 64) input.value = 64;
    }

    function addToCart(productId) {
      const p = products.find(prod => prod.id === productId);
      const qtyInput = document.getElementById(`qty-${productId}`);
      let qty = parseInt(qtyInput.value, 10);

      if (isNaN(qty) || qty < 1) qty = 1;
      if (qty > 64) qty = 64;

      const totalPriceNum = p.priceNum * qty;
      const title = `${qty}x ${p.name}`;
      const priceText = `${totalPriceNum}x ${p.curr}`;

      cart.push({ title, priceText });
      renderCart();
    }

    function renderCart() {
      const cartItemsDiv = document.getElementById('cart-items');
      const hiddenInput = document.getElementById('hidden-cart-input');
      const submitBtn = document.getElementById('submit-btn');

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="color: #777; font-size: 13px;">Dein Einkaufswagen ist leer.</p>';
        submitBtn.disabled = true;
        hiddenInput.value = '';
        return;
      }

      cartItemsDiv.innerHTML = '';
      let summaryText = [];

      cart.forEach((item) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'cart-item';
        itemDiv.innerHTML = `<span>${item.title}</span> <b>${item.priceText}</b>`;
        cartItemsDiv.appendChild(itemDiv);
        summaryText.push(`${item.title} -> ${item.priceText}`);
      });

      hiddenInput.value = summaryText.join(' | ');
      submitBtn.disabled = false;
    }

    function filterCategory(cat) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const title = document.getElementById('grid-title');
      document.getElementById('search-input').value = '';

      if (cat === 'all') {
        document.getElementById('btn-all').classList.add('active');
        title.innerText = "Alle Items";
        displayProducts(products);
      } else if (cat === 'deals') {
        document.getElementById('btn-deals').classList.add('active');
        title.innerText = "🔥 Angebote des Tages";
        displayProducts(products.filter(p => p.isDeal));
      } else {
        const btn = document.getElementById(`btn-${cat}`);
        if(btn) btn.classList.add('active');
        displayProducts(products.filter(p => p.category === cat));
      }
    }

    function performSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const title = document.getElementById('grid-title');

      if (!query) {
        displayProducts(products);
        title.innerText = "Alle Items";
        return;
      }

      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      title.innerText = `Suchergebnisse für "${query}" (${filtered.length})`;
      displayProducts(filtered);
    }

    displayProducts(products);
  </script>

</body>
</html>
